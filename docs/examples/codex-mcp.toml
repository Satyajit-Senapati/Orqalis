[mcp_servers.orqalis]
command = "/absolute/path/to/node"
args = ["/absolute/global-node-modules/orqalis/bin/orqalis.js", "mcp", "--policy", "/absolute/path/to/mcp-policy.json", "--root", "/absolute/path/to/repository"]
env_vars = ["ORQALIS_OPENAI_API_KEY", "ORQALIS_OPENAI_MODEL"]
startup_timeout_sec = 30
tool_timeout_sec = 600
