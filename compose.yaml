services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orqalis
      POSTGRES_PASSWORD: ${ORQALIS_POSTGRES_PASSWORD:-orqalis}
      POSTGRES_DB: orqalis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqalis -d orqalis"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
