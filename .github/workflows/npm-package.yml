name: npm package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact tested artifact from a version tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/npm/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm ci --prefix packages/npm
      - run: npm run check --prefix packages/npm
      - run: npm run lint --prefix packages/npm
      - run: npm run format:check --prefix packages/npm
      - run: npm test --prefix packages/npm
      - run: uv run ruff check scripts
      - run: uv run ruff format --check scripts
      - run: uv run mypy --strict scripts
      - run: uv build --wheel --out-dir .tools/release
      - run: uv run python scripts/prepare_npm.py
      - run: npm pack ./packages/npm --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: orqalis-npm
          path: dist/orqalis-*.tgz
          if-no-files-found: error
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            python: '3.12'
          - os: windows-latest
            node: '24'
            python: '3.12'
          - os: macos-latest
            node: '24'
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: orqalis-npm
          path: dist
      - name: Install without lifecycle scripts and exercise the global command
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist/orqalis-*.tgz).FullName
          $prefix = Join-Path $env:RUNNER_TEMP 'orqalis-npm'
          $runtime = Join-Path $env:RUNNER_TEMP 'orqalis-python'
          $env:ORQALIS_PYTHON = (Get-Command python).Source
          $env:ORQALIS_RUNTIME_HOME = $runtime
          npm install -g --prefix $prefix $package --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $env:RUNNER_TEMP 'orqalis-platform-smoke.json'
          python scripts/smoke_npm.py --prefix $prefix --runtime $runtime | Tee-Object -FilePath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = if ($IsWindows) { Join-Path $prefix 'orqalis.cmd' } else { Join-Path $prefix 'bin/orqalis' }
          & $executable version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain platform and architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orqalis-smoke-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.python }}
          path: ${{ runner.temp }}/orqalis-platform-smoke.json
          if-no-files-found: warn
  installed-integration:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install test clients and listener inspection utility
        run: |
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install -y lsof
      - uses: actions/download-artifact@v4
        with:
          name: orqalis-npm
          path: dist
      - name: Verify installed CLI, project store, MCP, API and UI outside checkout
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/orqalis-*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          prefix="$RUNNER_TEMP/orqalis-integrated-npm"
          runtime="$RUNNER_TEMP/orqalis-integrated-python"
          workspace="$RUNNER_TEMP/orqalis-integrated-workspace"
          mkdir -p "$workspace"
          export ORQALIS_PYTHON="$(command -v python)"
          export ORQALIS_RUNTIME_HOME="$runtime"
          npm install -g --prefix "$prefix" "$(realpath "${packages[0]}")" --ignore-scripts --no-audit --no-fund
          uv run python scripts/smoke_npm.py --prefix "$prefix" --runtime "$runtime" > "$RUNNER_TEMP/orqalis-installed-launcher.json"
          uv run python scripts/verify_installed.py --prefix "$prefix" --runtime "$runtime" --workspace "$workspace" --output "$RUNNER_TEMP/orqalis-installed-integration.json"
      - name: Retain installed release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orqalis-installed-integration
          path: |
            ${{ runner.temp }}/orqalis-installed-launcher.json
            ${{ runner.temp }}/orqalis-installed-integration.json
          if-no-files-found: warn
  publish:
    name: Publish exact tested npm artifact
    needs:
      - smoke
      - installed-integration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      startsWith(github.ref, 'refs/tags/v')
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pinned npm CLI with Trusted Publishing support
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"
      - uses: actions/download-artifact@v4
        with:
          name: orqalis-npm
          path: dist
      - name: Verify the tag and exact tested package
        id: release
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/orqalis-*.tgz)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          manifest_dir="$(mktemp -d)"
          tar -xzf "$package" -C "$manifest_dir" package/package.json
          manifest="$manifest_dir/package/package.json"
          package_name="$(node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.name)' "$manifest")"
          package_version="$(node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data.version)' "$manifest")"
          test "$package_name" = "orqalis"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$package" = "dist/orqalis-$package_version.tgz"
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Publish through npm Trusted Publishing
        run: npm publish "${{ steps.release.outputs.package }}" --access public --provenance
