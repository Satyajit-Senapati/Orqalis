name: quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Verify the install has no database runtime
        run: >-
          uv run python -c
          "import importlib.util as i;
          assert i.find_spec('sqlalchemy') is None;
          assert i.find_spec('alembic') is None;
          assert i.find_spec('pgvector') is None;
          assert i.find_spec('psycopg') is None"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=orqalis
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Seed persisted browser runs
        run: |
          uv run python -m tests.e2e.seed_runtime
          uv run python -m tests.e2e.seed_execution
          uv run python -c 'import json, os; from pathlib import Path; live = json.loads(Path(".tools/ui-fixture.json").read_text()); complete = json.loads(Path(".tools/ui-completed.json").read_text()); values = {"ORQALIS_E2E_RUN_ID": live["run_id"], "ORQALIS_E2E_COMPLETED_RUN_ID": complete["run_id"], "ORQALIS_E2E_PROJECT_ROOT": live["repo"]}; Path(os.environ["GITHUB_ENV"]).open("a").writelines(name + "=" + value + chr(10) for name, value in values.items())'
      - name: Browser contracts
        working-directory: web
        env:
          ORQALIS_BROWSER_CHANNEL: chromium
          ORQALIS_PROJECT_ROOT: ${{ env.ORQALIS_E2E_PROJECT_ROOT }}
        run: |
          ../.venv/bin/python -I -m orqalis ui > ../.tools/ci-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true; wait "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7842/health > /dev/null; then break; fi
            sleep 0.25
          done
          if ! curl --fail --silent http://127.0.0.1:7842/health > /dev/null; then
            cat ../.tools/ci-ui.log
            exit 1
          fi
          npm run test:e2e
