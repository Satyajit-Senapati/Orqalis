name: quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orqalis
          POSTGRES_PASSWORD: orqalis
          POSTGRES_DB: orqalis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orqalis -d orqalis_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ORQALIS_TEST_SANDBOX_IMAGE: pgvector/pgvector:pg17
      ORQALIS_TEST_DATABASE_URL: postgresql+psycopg://orqalis:orqalis@127.0.0.1:5432/orqalis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=orqalis
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Seed persisted browser runs
        env:
          ORQALIS_DATABASE_URL: postgresql+psycopg://orqalis:orqalis@127.0.0.1:5432/orqalis_test
        run: |
          uv run python -m tests.e2e.seed_runtime
          uv run python -m tests.e2e.seed_execution
          uv run orqalis ui
          uv run python -c 'import json, os; from pathlib import Path; records = [("ORQALIS_E2E_RUN_ID", ".tools/ui-fixture.json"), ("ORQALIS_E2E_COMPLETED_RUN_ID", ".tools/ui-completed.json")]; Path(os.environ["GITHUB_ENV"]).open("a").writelines(name + "=" + json.loads(Path(path).read_text())["run_id"] + chr(10) for name, path in records)'
      - name: Browser contracts
        working-directory: web
        env:
          ORQALIS_BROWSER_CHANNEL: chromium
        run: npx playwright test
