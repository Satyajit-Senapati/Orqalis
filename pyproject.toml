[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orqalis"
version = "2.0.0"
description = "Durable, provider-neutral engineering orchestration and project memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "typer>=0.16,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "jsonschema>=4.23,<5",
  "mcp>=2,<3",
]

[project.scripts]
orqalis = "orqalis.cli.app:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# Preserve canonical Markdown and its embedded examples byte-for-byte.
exclude = ["docs/*.md", "docs/**/*.md", "CODEX_HANDOFF.md", "SIGNOFF.md", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: requires Docker and ORQALIS_TEST_SANDBOX_IMAGE already pulled"]

[tool.coverage.run]
source = ["orqalis"]
branch = true

[tool.hatch.build.hooks.custom]
